  <div class="results-panel" id="results-panel"{% if hidden %} hidden{% endif %}>
    <div class="stats" id="stats"></div>

    <section class="results-section">
      <h3>Matching articles <span class="sort-hint" id="articles-count"></span></h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Title</th><th>Snippet</th><th>Keywords</th><th>Comment matches</th></tr>
          </thead>
          <tbody id="articles-body"></tbody>
        </table>
      </div>
    </section>

    <section class="results-section">
      <div class="comments-header">
        <h3>Matching comments <span class="sort-hint" id="comments-count"></span></h3>
        <button type="button" class="btn btn-small" id="toggle-groups">Collapse all</button>
      </div>
      <div class="filter-bar">
        <input type="search" id="comment-filter" class="filter-input" placeholder="Search author, article or text…"
               aria-label="Search comments">
        <div class="chip-group" id="keyword-chips" role="group" aria-label="Filter by keyword"></div>
        <select id="article-filter" class="select" aria-label="Filter by article">
          <option value="">All articles</option>
        </select>
        <select id="comment-sort" class="select" aria-label="Sort comments">
          <option value="article">Group by article</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <label class="check"><input type="checkbox" id="hide-replies"> Hide replies</label>
        <label class="check" id="only-new-wrap" hidden><input type="checkbox" id="only-new"> Only new</label>
        <button type="button" class="link-btn" id="clear-filters" hidden>Clear filters</button>
      </div>
      <div id="comments-list"></div>
    </section>
  </div>
