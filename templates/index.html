<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blazer's Edge – Deni/Avdija Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='results.js') }}"></script>
</head>
<body>
  <h1>Blazer's Edge – Deni/Avdija Scanner</h1>
  <p class="subtitle" id="subtitle">Scan recent Blazer's Edge articles and comments for mentions of Deni Avdija.</p>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="run-scan">Run new scan</button>
    <button type="button" class="btn btn-print" id="print-results" hidden>Print results</button>
    <button type="button" class="btn" id="export-csv" hidden>Export CSV</button>
    <button type="button" class="btn btn-danger" id="delete-all-scans">Delete all scans</button>
    <span class="status-msg" id="status-msg" role="status"></span>
  </div>

  <section class="scans-section">
    <h2>Recent scans</h2>
    <ul class="scan-list" id="scan-list"></ul>
  </section>

{% with hidden = true %}{% include "_results.html" %}{% endwith %}

  <script>
    const $ = id => document.getElementById(id);
    const { escapeHtml, fmtDateTime } = Results;
    const statusEl = $('status-msg');
    const runBtn = $('run-scan');
    const state = { selectedScanId: null, pollTimer: null };

    function setStatus(msg) { statusEl.textContent = msg || ''; }

    function authHeaders() {
      const pw = localStorage.getItem('scannerPassword');
      return pw ? { 'X-Scanner-Password': pw } : {};
    }

    // fetch wrapper for state-changing calls: prompts for the password on 401 and retries once.
    async function api(url, options = {}, retried = false) {
      const res = await fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
      if (res.status === 401 && !retried) {
        const pw = prompt('Password required:');
        if (pw === null) throw new Error('Cancelled');
        localStorage.setItem('scannerPassword', pw);
        return api(url, options, true);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status, data });
      return data;
    }

    async function loadConfig() {
      try {
        const cfg = await api('/api/config');
        $('subtitle').textContent =
          `Scans articles from the last ${cfg.lookback_days} days (up to ${cfg.max_articles}) and their comments ` +
          `for: ${cfg.keywords.join(', ')}.`;
      } catch (e) { /* keep default subtitle */ }
    }

    async function loadScans() {
      let data;
      try { data = await api('/api/scans'); } catch (e) { setStatus('Failed to load scans.'); return; }
      const list = $('scan-list');
      list.innerHTML = '';
      if (!data.scans.length) {
        list.innerHTML = '<li class="scan-item empty-item">No scans yet. Click "Run new scan" to start.</li>';
        return data.scans;
      }
      for (const scan of data.scans) {
        const li = document.createElement('li');
        li.className = 'scan-item' + (state.selectedScanId === scan.id ? ' selected' : '');
        li.dataset.scanId = scan.id;
        const detail = scan.status === 'running'
          ? escapeHtml(scan.progress || 'Running…')
          : scan.status === 'failed'
            ? `<span class="error-text">${escapeHtml(scan.error_message || 'Failed')}</span>`
            : `Articles: ${scan.articles_found ?? 0} · Comments: ${scan.comments_found ?? 0}`;
        li.innerHTML = `
          <div>
            <strong>Scan #${scan.id}</strong> — ${escapeHtml(fmtDateTime(scan.started_at))}
            <div class="meta">${detail}</div>
          </div>
          <div class="scan-item-actions">
            <span class="badge ${escapeHtml(scan.status)}">${escapeHtml(scan.status)}</span>
            ${scan.status !== 'running' ? '<button type="button" class="icon-btn" title="Delete scan" aria-label="Delete scan">✕</button>' : ''}
          </div>`;
        li.addEventListener('click', () => selectScan(scan.id));
        li.querySelector('.icon-btn')?.addEventListener('click', ev => { ev.stopPropagation(); deleteScan(scan.id); });
        list.appendChild(li);
      }
      return data.scans;
    }

    async function selectScan(scanId) {
      state.selectedScanId = scanId;
      document.querySelectorAll('.scan-item').forEach(el =>
        el.classList.toggle('selected', Number(el.dataset.scanId) === scanId));
      setStatus('Loading results…');
      try {
        const data = await api(`/api/scans/${scanId}/results`);
        Results.render(data.results);
        $('results-panel').hidden = false;
        $('print-results').hidden = $('export-csv').hidden = false;
        setStatus('');
      } catch (e) {
        setStatus('Failed to load results.');
      }
    }

    function pollScan(scanId) {
      clearTimeout(state.pollTimer);
      runBtn.disabled = true;
      const tick = async () => {
        try {
          const { scan } = await api(`/api/scans/${scanId}`);
          if (scan.status === 'running') {
            setStatus(`Scan #${scanId}: ${scan.progress || 'running…'}`);
            const li = document.querySelector(`.scan-item[data-scan-id="${scanId}"] .meta`);
            if (li) li.textContent = scan.progress || 'Running…';
            state.pollTimer = setTimeout(tick, 2000);
            return;
          }
          runBtn.disabled = false;
          setStatus(scan.status === 'failed' ? `Scan #${scanId} failed: ${scan.error_message}` : `Scan #${scanId} finished.`);
          await loadScans();
          selectScan(scanId);
        } catch (e) {
          state.pollTimer = setTimeout(tick, 5000);
        }
      };
      tick();
    }

    async function startScan() {
      runBtn.disabled = true;
      setStatus('Starting scan…');
      try {
        const { scan_id } = await api('/api/scan', { method: 'POST' });
        await loadScans();
        pollScan(scan_id);
      } catch (e) {
        if (e.status === 409 && e.data?.scan_id) { pollScan(e.data.scan_id); return; }
        runBtn.disabled = false;
        setStatus(e.message === 'Cancelled' ? '' : `Failed to start scan: ${e.message}`);
      }
    }

    function clearSelection() {
      state.selectedScanId = null;
      $('results-panel').hidden = true;
      $('print-results').hidden = $('export-csv').hidden = true;
    }

    async function deleteScan(scanId) {
      if (!confirm(`Delete scan #${scanId}?`)) return;
      try {
        await api(`/api/scans/${scanId}`, { method: 'DELETE' });
        if (state.selectedScanId === scanId) clearSelection();
        loadScans();
      } catch (e) { if (e.message !== 'Cancelled') setStatus(`Delete failed: ${e.message}`); }
    }

    async function deleteAllScans() {
      if (!confirm('Delete all finished scans and their results? This cannot be undone.')) return;
      try {
        await api('/api/scans', { method: 'DELETE' });
        clearSelection();
        setStatus('All finished scans deleted.');
        loadScans();
      } catch (e) { if (e.message !== 'Cancelled') setStatus(`Delete failed: ${e.message}`); }
    }

    runBtn.addEventListener('click', startScan);
    $('delete-all-scans').addEventListener('click', deleteAllScans);
    $('print-results').addEventListener('click', () => window.print());
    $('export-csv').addEventListener('click', () => Results.exportCsv(`blazers-scan-${state.selectedScanId}.csv`));

    loadConfig();
    loadScans().then(scans => {
      const running = scans?.find(s => s.status === 'running');
      if (running) pollScan(running.id);
      else if (scans?.length) selectScan(scans[0].id);
    });
  </script>
</body>
</html>
