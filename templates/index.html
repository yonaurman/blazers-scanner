<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blazer's Edge – Deni/Avdija Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Blazer's Edge – Deni/Avdija Scanner</h1>
  <p class="subtitle" id="subtitle">Scan recent Blazer's Edge articles and comments for mentions of Deni Avdija.</p>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="run-scan">Run new scan</button>
    <button type="button" class="btn btn-print" id="print-results" hidden>Print results</button>
    <button type="button" class="btn" id="export-csv" hidden>Export CSV</button>
    <button type="button" class="btn btn-danger" id="delete-all-scans">Delete all scans</button>
    <span class="status-msg" id="status-msg" role="status"></span>
  </div>

  <section class="scans-section">
    <h2>Recent scans</h2>
    <ul class="scan-list" id="scan-list"></ul>
  </section>

  <div class="results-panel" id="results-panel" hidden>
    <h3>Matching articles <span class="sort-hint" id="articles-count"></span></h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Title</th><th>Snippet</th><th>Keywords</th></tr>
        </thead>
        <tbody id="articles-body"></tbody>
      </table>
    </div>

    <div class="comments-header">
      <h3>Matching comments <span class="sort-hint" id="comments-count"></span></h3>
      <input type="search" id="comment-filter" class="filter-input" placeholder="Filter by author, article or text…">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Article</th><th>Comment #</th><th>Posted</th><th>Author</th><th>Comment</th></tr>
        </thead>
        <tbody id="comments-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const statusEl = $('status-msg');
    const runBtn = $('run-scan');
    const state = { selectedScanId: null, results: null, pollTimer: null };

    function setStatus(msg) { statusEl.textContent = msg || ''; }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Older rows were stored without a timezone suffix; they are UTC.
    function parseUtc(s) {
      if (!s) return null;
      const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
      return isNaN(d) ? null : d;
    }
    function fmtDate(s) {
      const d = parseUtc(s);
      return d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    }
    function fmtDateTime(s) {
      const d = parseUtc(s);
      return d ? d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
    }

    function splitKeywords(str) { return (str || '').split(',').map(k => k.trim()).filter(Boolean); }

    // Mirrors scanner/keywords.py: word boundaries, case-insensitive, optional possessive.
    function highlight(text, keywordsStr) {
      const kws = splitKeywords(keywordsStr).sort((a, b) => b.length - a.length);
      if (!text || !kws.length) return escapeHtml(text);
      const alt = kws.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+')).join('|');
      const re = new RegExp(`\\b((?:${alt})(?:['\u2019]?s)?)\\b`, 'gi');
      return text.split(re).map((part, i) => i % 2 ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part)).join('');
    }

    function authHeaders() {
      const pw = localStorage.getItem('scannerPassword');
      return pw ? { 'X-Scanner-Password': pw } : {};
    }

    // fetch wrapper for state-changing calls: prompts for the password on 401 and retries once.
    async function api(url, options = {}, retried = false) {
      const res = await fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
      if (res.status === 401 && !retried) {
        const pw = prompt('Password required:');
        if (pw === null) throw new Error('Cancelled');
        localStorage.setItem('scannerPassword', pw);
        return api(url, options, true);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status, data });
      return data;
    }

    async function loadConfig() {
      try {
        const cfg = await api('/api/config');
        $('subtitle').textContent =
          `Scans articles from the last ${cfg.lookback_days} days (up to ${cfg.max_articles}) and their comments ` +
          `for: ${cfg.keywords.join(', ')}.`;
      } catch (e) { /* keep default subtitle */ }
    }

    async function loadScans() {
      let data;
      try { data = await api('/api/scans'); } catch (e) { setStatus('Failed to load scans.'); return; }
      const list = $('scan-list');
      list.innerHTML = '';
      if (!data.scans.length) {
        list.innerHTML = '<li class="scan-item empty-item">No scans yet. Click "Run new scan" to start.</li>';
        return data.scans;
      }
      for (const scan of data.scans) {
        const li = document.createElement('li');
        li.className = 'scan-item' + (state.selectedScanId === scan.id ? ' selected' : '');
        li.dataset.scanId = scan.id;
        const detail = scan.status === 'running'
          ? escapeHtml(scan.progress || 'Running…')
          : scan.status === 'failed'
            ? `<span class="error-text">${escapeHtml(scan.error_message || 'Failed')}</span>`
            : `Articles: ${scan.articles_found ?? 0} · Comments: ${scan.comments_found ?? 0}`;
        li.innerHTML = `
          <div>
            <strong>Scan #${scan.id}</strong> — ${escapeHtml(fmtDateTime(scan.started_at))}
            <div class="meta">${detail}</div>
          </div>
          <div class="scan-item-actions">
            <span class="badge ${escapeHtml(scan.status)}">${escapeHtml(scan.status)}</span>
            ${scan.status !== 'running' ? '<button type="button" class="icon-btn" title="Delete scan" aria-label="Delete scan">✕</button>' : ''}
          </div>`;
        li.addEventListener('click', () => selectScan(scan.id));
        li.querySelector('.icon-btn')?.addEventListener('click', ev => { ev.stopPropagation(); deleteScan(scan.id); });
        list.appendChild(li);
      }
      return data.scans;
    }

    async function selectScan(scanId) {
      state.selectedScanId = scanId;
      document.querySelectorAll('.scan-item').forEach(el =>
        el.classList.toggle('selected', Number(el.dataset.scanId) === scanId));
      setStatus('Loading results…');
      try {
        const data = await api(`/api/scans/${scanId}/results`);
        state.results = data.results;
        renderResults();
        $('results-panel').hidden = false;
        $('print-results').hidden = $('export-csv').hidden = false;
        setStatus('');
      } catch (e) {
        setStatus('Failed to load results.');
      }
    }

    function renderResults() {
      const { articles, comments } = state.results;
      $('articles-count').textContent = `(${articles.length}, newest first)`;
      $('articles-body').innerHTML = articles.length ? articles.map(a => `
        <tr>
          <td class="date-cell">${escapeHtml(fmtDate(a.article_date))}</td>
          <td><a href="${escapeHtml(a.url)}" target="_blank" rel="noopener"><strong>${escapeHtml(a.title)}</strong></a></td>
          <td class="snippet">${highlight(a.snippet_or_body, a.matched_keywords)}</td>
          <td><div class="keywords">${splitKeywords(a.matched_keywords).map(k => `<span>${escapeHtml(k)}</span>`).join('')}</div></td>
        </tr>`).join('') : '<tr><td colspan="4" class="empty">No matching articles.</td></tr>';
      renderComments();
    }

    function renderComments() {
      const q = $('comment-filter').value.trim().toLowerCase();
      const all = state.results.comments;
      const rows = q ? all.filter(c => `${c.author} ${c.article_title} ${c.comment_text}`.toLowerCase().includes(q)) : all;
      $('comments-count').textContent = q ? `(${rows.length} of ${all.length})` : `(${all.length}, grouped by article, newest first)`;
      let lastArticle = null;
      $('comments-body').innerHTML = rows.length ? rows.map(c => {
        const first = c.article_url !== lastArticle;
        lastArticle = c.article_url;
        const num = c.comment_index != null ? `${c.comment_index}${c.total_comments ? ' of ' + c.total_comments : ''}` : '—';
        return `
        <tr class="${first ? 'group-start' : ''}">
          <td>${first ? `<a href="${escapeHtml(c.article_url)}" target="_blank" rel="noopener">${escapeHtml(c.article_title || 'Article')}</a>
                <div class="date-cell">${escapeHtml(fmtDate(c.article_date))}</div>` : ''}</td>
          <td class="nowrap">${escapeHtml(num)}${c.is_reply ? ' <span class="reply-tag">reply</span>' : ''}</td>
          <td class="date-cell">${escapeHtml(fmtDateTime(c.comment_created_at))}</td>
          <td>${escapeHtml(c.author)}</td>
          <td class="snippet comment-text">${highlight(c.comment_text, c.matched_keywords)}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="5" class="empty">${q ? 'No comments match the filter.' : 'No matching comments.'}</td></tr>`;
    }

    function pollScan(scanId) {
      clearTimeout(state.pollTimer);
      runBtn.disabled = true;
      const tick = async () => {
        try {
          const { scan } = await api(`/api/scans/${scanId}`);
          if (scan.status === 'running') {
            setStatus(`Scan #${scanId}: ${scan.progress || 'running…'}`);
            const li = document.querySelector(`.scan-item[data-scan-id="${scanId}"] .meta`);
            if (li) li.textContent = scan.progress || 'Running…';
            state.pollTimer = setTimeout(tick, 2000);
            return;
          }
          runBtn.disabled = false;
          setStatus(scan.status === 'failed' ? `Scan #${scanId} failed: ${scan.error_message}` : `Scan #${scanId} finished.`);
          await loadScans();
          selectScan(scanId);
        } catch (e) {
          state.pollTimer = setTimeout(tick, 5000);
        }
      };
      tick();
    }

    async function startScan() {
      runBtn.disabled = true;
      setStatus('Starting scan…');
      try {
        const { scan_id } = await api('/api/scan', { method: 'POST' });
        await loadScans();
        pollScan(scan_id);
      } catch (e) {
        if (e.status === 409 && e.data?.scan_id) { pollScan(e.data.scan_id); return; }
        runBtn.disabled = false;
        setStatus(e.message === 'Cancelled' ? '' : `Failed to start scan: ${e.message}`);
      }
    }

    function clearSelection() {
      state.selectedScanId = null;
      state.results = null;
      $('results-panel').hidden = true;
      $('print-results').hidden = $('export-csv').hidden = true;
    }

    async function deleteScan(scanId) {
      if (!confirm(`Delete scan #${scanId}?`)) return;
      try {
        await api(`/api/scans/${scanId}`, { method: 'DELETE' });
        if (state.selectedScanId === scanId) clearSelection();
        loadScans();
      } catch (e) { if (e.message !== 'Cancelled') setStatus(`Delete failed: ${e.message}`); }
    }

    async function deleteAllScans() {
      if (!confirm('Delete all finished scans and their results? This cannot be undone.')) return;
      try {
        await api('/api/scans', { method: 'DELETE' });
        clearSelection();
        setStatus('All finished scans deleted.');
        loadScans();
      } catch (e) { if (e.message !== 'Cancelled') setStatus(`Delete failed: ${e.message}`); }
    }

    function csvCell(v) {
      let s = String(v ?? '');
      if (/^[=+\-@]/.test(s)) s = "'" + s;  // stop spreadsheet formula injection
      return `"${s.replace(/"/g, '""')}"`;
    }

    function exportCsv() {
      if (!state.results) return;
      const rows = [['Type', 'Article date', 'Article', 'URL', 'Comment #', 'Comment posted', 'Author', 'Text', 'Keywords']];
      for (const a of state.results.articles) {
        rows.push(['Article', a.article_date, a.title, a.url, '', '', '', a.snippet_or_body, a.matched_keywords]);
      }
      for (const c of state.results.comments) {
        const num = c.comment_index != null ? `${c.comment_index}${c.total_comments ? ' of ' + c.total_comments : ''}` : '';
        rows.push(['Comment', c.article_date, c.article_title, c.article_url, num, c.comment_created_at, c.author, c.comment_text, c.matched_keywords]);
      }
      // BOM so Excel opens the file as UTF-8.
      const blob = new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `blazers-scan-${state.selectedScanId}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    runBtn.addEventListener('click', startScan);
    $('delete-all-scans').addEventListener('click', deleteAllScans);
    $('print-results').addEventListener('click', () => window.print());
    $('export-csv').addEventListener('click', exportCsv);
    $('comment-filter').addEventListener('input', () => state.results && renderComments());

    loadConfig();
    loadScans().then(scans => {
      const running = scans?.find(s => s.status === 'running');
      if (running) pollScan(running.id);
      else if (scans?.length) selectScan(scans[0].id);
    });
  </script>
</body>
</html>
